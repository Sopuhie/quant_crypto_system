<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant Crypto System</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">
    <header class="header">
      <div>
        <h1>Quant Crypto System</h1>
        <p class="subtitle">SQLite 实时监控面板</p>
      </div>
      <div class="header-actions">
        <span id="health-badge" class="badge badge-muted">检测中...</span>
        <button id="btn-refresh" class="btn btn-primary">刷新数据</button>
      </div>
    </header>

    <section class="cards" id="status-cards">
      <article class="card">
        <span class="label">系统状态</span>
        <strong id="stat-status">-</strong>
      </article>
      <article class="card">
        <span class="label">数据库</span>
        <strong id="stat-db">-</strong>
      </article>
      <article class="card">
        <span class="label">活跃策略</span>
        <strong id="stat-strategies">-</strong>
      </article>
      <article class="card">
        <span class="label">订单总数</span>
        <strong id="stat-orders">-</strong>
      </article>
    </section>

    <div class="grid-2">
      <section class="panel">
        <div class="panel-head">
          <h2>策略配置</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>策略名</th>
                <th>交易对</th>
                <th>状态</th>
                <th>目标盈利</th>
                <th>目标止损</th>
                <th>更新时间</th>
              </tr>
            </thead>
            <tbody id="strategies-body">
              <tr><td colspan="6" class="empty">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>账户持仓</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>账户类型</th>
                <th>资产</th>
                <th>交易对</th>
                <th>可用</th>
                <th>冻结</th>
                <th>总量</th>
                <th>未实现盈亏</th>
              </tr>
            </thead>
            <tbody id="positions-body">
              <tr><td colspan="7" class="empty">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="grid-2">
      <section class="panel">
        <div class="panel-head">
          <h2>最近订单</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>策略</th>
                <th>交易对</th>
                <th>方向</th>
                <th>类型</th>
                <th>数量</th>
                <th>价格</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="orders-body">
              <tr><td colspan="8" class="empty">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>市场 K 线缓存</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>交易对</th>
                <th>周期</th>
                <th>开</th>
                <th>高</th>
                <th>低</th>
                <th>收</th>
                <th>量</th>
              </tr>
            </thead>
            <tbody id="klines-body">
              <tr><td colspan="8" class="empty">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
