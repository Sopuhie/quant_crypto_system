<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant Crypto System</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">
    <header class="header">
      <div>
        <h1>Quant Crypto System</h1>
        <p class="subtitle">Binance 量化交易控制台</p>
      </div>
      <div class="header-actions">
        <span id="health-badge" class="badge badge-muted">检测中...</span>
        <button id="btn-start" class="btn btn-primary">启动系统</button>
        <button id="btn-stop" class="btn btn-danger" disabled>停止系统</button>
      </div>
    </header>

    <section class="cards" id="status-cards">
      <article class="card">
        <span class="label">运行状态</span>
        <strong id="stat-running">-</strong>
      </article>
      <article class="card">
        <span class="label">模式</span>
        <strong id="stat-sandbox">-</strong>
      </article>
      <article class="card">
        <span class="label">账户权益 (USDT)</span>
        <strong id="stat-equity">-</strong>
      </article>
      <article class="card">
        <span class="label">当日回撤</span>
        <strong id="stat-drawdown">-</strong>
      </article>
      <article class="card">
        <span class="label">熔断器</span>
        <strong id="stat-breaker">-</strong>
      </article>
      <article class="card">
        <span class="label">策略数量</span>
        <strong id="stat-strategies">-</strong>
      </article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>风控与配置</h2>
        <button id="btn-reset-breaker" class="btn btn-secondary">重置熔断器</button>
      </div>
      <div class="meta-grid" id="risk-meta"></div>
    </section>

    <div class="grid-2">
      <section class="panel">
        <div class="panel-head">
          <h2>最近订单</h2>
          <button class="btn btn-ghost" data-refresh="orders">刷新</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>策略</th>
                <th>交易对</th>
                <th>方向</th>
                <th>数量</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="orders-body">
              <tr><td colspan="6" class="empty">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>最近 K 线</h2>
          <button class="btn btn-ghost" data-refresh="klines">刷新</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>交易对</th>
                <th>周期</th>
                <th>开</th>
                <th>高</th>
                <th>低</th>
                <th>收</th>
              </tr>
            </thead>
            <tbody id="klines-body">
              <tr><td colspan="7" class="empty">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <section class="panel">
      <div class="panel-head">
        <h2>运行日志</h2>
        <div class="tabs">
          <button class="tab active" data-log="info">Info</button>
          <button class="tab" data-log="error">Error</button>
        </div>
      </div>
      <pre id="log-view" class="log-view">加载中...</pre>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
